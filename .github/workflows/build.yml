name: ChatterUI Advanced Android Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.configureondemand=true
        -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
        -Dkotlin.incremental=false
      EXPO_NO_TELEMETRY: 1
      NPM_CONFIG_FUND: false
      NPM_CONFIG_AUDIT: false
      NPM_CONFIG_UPDATE_NOTIFIER: false
      RCT_NO_LAUNCH_PACKAGER: 1
      CCACHE_DIR: ~/.ccache
      # Variables de entorno globales para forzar ARM64 en React Native
      REACT_NATIVE_ARCHS: arm64-v8a

    steps:

      # ── 1. LIBERAR ESPACIO ──────────────────────────────────────────────────
      - name: Free disk space
        run: |
          echo "=== Espacio antes ==="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/build-tools \
            /usr/local/lib/android/sdk/platforms \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/go \
            /opt/az \
            /opt/google \
            /imagegeneration \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/share/php* \
            /usr/lib/jvm/temurin-* \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "=== Espacio después ==="
          df -h /

      # ── 2. SWAP ─────────────────────────────────────────────────────────────
      - name: Configure swap (8 GB)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl vm.swappiness=10
          echo "Swap activo:"
          swapon --show

      # ── 3. HERRAMIENTAS DEL SISTEMA Y JAVA ──────────────────────────────────
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            cmake \
            ccache \
            unzip \
            curl

      # ── 4. ANDROID SDK / NDK ────────────────────────────────────────────────
      - name: Install Android NDK and build tools
        run: |
          SDKMANAGER=$(find $ANDROID_SDK_ROOT/cmdline-tools -name "sdkmanager" -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name "sdkmanager" -type f 2>/dev/null | head -1)
          fi
          echo "sdkmanager encontrado en: $SDKMANAGER"
          export PATH="$(dirname $SDKMANAGER):$PATH"
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER --install \
            "ndk;27.2.12479018" \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "cmake;3.22.1"
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT"                        >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"                   >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "NDK_HOME=$SDK_ROOT/ndk/27.2.12479018"         >> $GITHUB_ENV
          echo "$(dirname $SDKMANAGER)"                        >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools"                      >> $GITHUB_PATH

      # ── 5. NODE ─────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 6. CCACHE ───────────────────────────────────────────────────────────
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-android-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-android-${{ runner.os }}-${{ github.ref_name }}-
            ccache-android-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      # ── 7. CHECKOUT ─────────────────────────────────────────────────────────
      - name: Checkout ChatterUI-advanced
        uses: actions/checkout@v4
        with:
          path: ChatterUI

      # ── 8. CACHÉ DE node_modules ────────────────────────────────────────────
      - name: Cache node_modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ChatterUI/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('ChatterUI/package.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      # ── 9. INSTALAR DEPENDENCIAS ────────────────────────────────────────────
      - name: Install npm dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        working-directory: ChatterUI
        run: |
          npm install \
            --prefer-offline \
            --no-audit \
            --no-fund \
            --ignore-scripts=false \
            --loglevel=error

      # ── 10. CACHÉ DE GRADLE CON SETUP-GRADLE ────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 11. EXPO PREBUILD ───────────────────────────────────────────────────
      - name: Expo prebuild (Android)
        working-directory: ChatterUI
        run: |
          npx expo prebuild --platform android --clean --non-interactive
        env:
          APP_VARIANT: production

      # ── 11b. FORZAR ARQUITECTURA EXCLUSIVA ARM64-V8A ─────────────────────────
      - name: Force ARM64 architecture in gradle.properties
        working-directory: ChatterUI/android
        run: |
          echo "" >> gradle.properties
          echo "# Force ARM64-v8a execution" >> gradle.properties
          echo "reactNativeArchitectures=arm64-v8a" >> gradle.properties
          echo "android.injected.build.abi=arm64-v8a" >> gradle.properties

      # ── 12. CODEGEN (New Architecture) ──────────────────────────────────────
      - name: Run React Native codegen
        working-directory: ChatterUI/android
        run: |
          ./gradlew generateCodegenArtifactsFromSchema \
            --no-daemon \
            --parallel \
            --configure-on-demand \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=false \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.abiFilters=arm64-v8a

      # ── 13. LIBERAR RAM ─────────────────────────────────────────────────────
      - name: Free RAM before native build
        run: |
          echo "=== RAM antes ==="
          free -h
          sudo sync
          echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null
          echo "=== RAM después ==="
          free -h

      # ── 14. BUILD APK ───────────────────────────────────────────────────────
      - name: Build APK (release)
        working-directory: ChatterUI/android
        run: |
          export CC="ccache clang"
          export CXX="ccache clang++"
          export CCACHE_CPP2=yes

          ./gradlew assembleRelease \
            --no-daemon \
            --parallel \
            --configure-on-demand \
            --stacktrace \
            -x lint \
            -x test \
            -Pandroid.enableJetifier=false \
            -Pandroid.useAndroidX=true \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.abiFilters=arm64-v8a

      # ── 15. STATS DE CCACHE ─────────────────────────────────────────────────
      - name: ccache stats
        if: always()
        run: command -v ccache && ccache --show-stats || echo "ccache no disponible"

      # ── 16. SUBIR APK ───────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatterUI-advanced-${{ github.ref_name }}-${{ github.run_number }}
          path: ChatterUI/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
